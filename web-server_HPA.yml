apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-server
spec:
  maxReplicas: 10
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-server
status:
  currentMetrics: null
  desiredReplicas: 3
